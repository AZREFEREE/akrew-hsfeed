name: Weekly results history

on:
  push:
    branches: [main]
    paths: [".github/workflows/history.yml"]
  schedule:
    - cron: "41 9 * * 0"   # Sunday 2:41 AM Arizona time
  workflow_dispatch:
    inputs:
      seasons:
        description: "Which seasons"
        type: choice
        options: [now, last, both]
        default: both

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick seasons
        id: pick
        run: |
          s="${{ inputs.seasons }}"
          if [ -z "$s" ]; then
            # weekly: this season's results; last season only until we have it
            y=$(python -c "import datetime as d;t=d.date.today();print(t.year if t.month>=7 else t.year-1)")
            if [ -f "data/history_$((y-1)).json" ]; then s=now; else s=both; fi
          fi
          echo "seasons=$s" >> "$GITHUB_OUTPUT"
      - name: Pull every varsity team page (about an hour per season)
        run: python scripts/hsfeed.py --out data --history ${{ steps.pick.outputs.seasons }}
      - name: Save
        if: always()
        run: |
          git config user.name "akrew-hsfeed"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Results history $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
